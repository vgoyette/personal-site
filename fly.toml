# fly.toml app configuration file generated for vgoyette on 2026-07-11T14:49:53-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vgoyette'
primary_region = 'yyz'
console_command = '/rails/bin/rails console'

[build]
[deploy]
  release_command = 'bin/rails db:prepare'

[env]
  RAILS_MAX_THREADS = '3'
  WEB_CONCURRENCY = '1'
  HTTP_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/up'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
